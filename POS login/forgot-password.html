<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | POS System</title>
    <link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Berkshire+Swash&display=swap" rel="stylesheet">
</head>

<body class="recovery-page">

    <div class="recovery-card">
        <div class="recovery-brand">
            <div class="recovery-logo">POS</div>
            <h2>POS System</h2>
        </div>

        <div class="recovery-icon">🔒</div>

        <h1>Reset Password</h1>

        <p class="recovery-description">
            Create a new password for your account.
        </p>

        <form action="#" method="post">
            <div class="form-group">
                <label for="new-password">New Password</label>
                <input
                    type="password"
                    id="new-password"
                    name="newPassword"
                    placeholder="Enter new password"
                    minlength="8"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input
                    type="password"
                    id="confirm-password"
                    name="confirmPassword"
                    placeholder="Confirm new password"
                    minlength="8"
                    required
                >
            </div>

            <p id="password-message" role="status"></p>

            <button type="submit" class="login-btn">
                Reset Password
            </button>
        </form>

        <a href="index.html" class="back-to-login">
            Back to Login
        </a>
    </div>

    <script>
        const form = document.querySelector("form");
        const newPassword = document.getElementById("new-password");
        const confirmPassword = document.getElementById("confirm-password");
        const message = document.getElementById("password-message");

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            if (newPassword.value !== confirmPassword.value) {
                message.textContent = "Passwords do not match.";
                message.style.color = "red";
                return;
            }

            message.textContent =
                "Passwords match. Backend connection will be added later.";
            message.style.color = "green";
        });
    </script>

</body>
</html>
